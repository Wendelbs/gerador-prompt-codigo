version: '3.9'
services:
  mongodb:
    image: mongo:7
    container_name: app-mongodb
    ports:
      - '27017:27017'
    volumes:
      - mongo_data:/data/db

  auth-service:
    build:
      context: .
      dockerfile: services/auth-service/Dockerfile
    environment:
      PORT: 3001
      MONGO_URI: mongodb://mongodb:27017/auth
      JWT_ACCESS_SECRET: access_secret
      JWT_REFRESH_SECRET: refresh_secret
    depends_on:
      - mongodb

  data-service:
    build:
      context: .
      dockerfile: services/data-service/Dockerfile
    environment:
      PORT: 3002
      MONGO_URI: mongodb://mongodb:27017/data
      JWT_ACCESS_SECRET: access_secret
    depends_on:
      - mongodb

  api-gateway:
    build:
      context: .
      dockerfile: services/api-gateway/Dockerfile
    ports:
      - '3000:3000'
    environment:
      PORT: 3000
      AUTH_SERVICE_URL: http://auth-service:3001
      DATA_SERVICE_URL: http://data-service:3002
    depends_on:
      - auth-service
      - data-service

volumes:
  mongo_data:
